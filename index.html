<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>犬来八荒 · 知识库图谱</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root {
  --glass: rgba(12,12,35,.65);
  --glass2: rgba(15,15,45,.55);
  --border: rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.12);
  --text: #e0e0f0;
  --text2: rgba(200,200,240,.6);
  --accent: #7c5cfc;
  --accent2: #b388ff;
  --glow: rgba(124,92,252,.25);
  --bg: linear-gradient(135deg,#070718,#0b0b2e 30%,#180a2e 60%,#081220);
}
body{font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;}
.app{display:flex;width:100vw;height:100vh;position:relative}

/* loading */
.loading{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s}
.loading.hidden{opacity:0;pointer-events:none}
.loading .bar{width:200px;height:3px;background:rgba(124,92,252,.1);border-radius:3px;overflow:hidden;margin-bottom:12px}
.loading .bar-inner{height:100%;width:0%;background:var(--accent);border-radius:3px;transition:width .3s}
.loading .txt{font-size:13px;color:var(--text2)}
.loading .sub{font-size:11px;color:rgba(200,200,240,.4);margin-top:4px}

/* sidebar */
.sidebar{width:280px;min-width:280px;background:var(--glass);backdrop-filter:blur(14px);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.sidebar-h{padding:16px;border-bottom:1px solid var(--border)}
.sidebar-h h1{font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sidebar-h .sub{font-size:10px;color:var(--text2);margin-top:2px}
.search-box{padding:8px 12px;border-bottom:1px solid var(--border)}
.search-box input{width:100%;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:12px;outline:none;transition:border-color .3s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 14px var(--glow)}
.search-box input::placeholder{color:var(--text2)}
.node-list{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.08) transparent}
.node-list::-webkit-scrollbar{width:3px}
.node-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:2px}
.ng-title{padding:8px 14px 3px;font-size:10px;font-weight:600;letter-spacing:.5px;opacity:.6}
.ni{padding:6px 14px;border-left:3px solid transparent;cursor:pointer;transition:all .12s}
.ni:hover{background:rgba(124,92,252,.08);border-left-color:rgba(124,92,252,.2)}
.ni.active{background:rgba(124,92,252,.12);border-left-color:var(--accent)}
.ni .t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ni .m{display:flex;gap:5px;margin-top:1px;font-size:9px;color:var(--text2)}
.ni .b{display:inline-block;padding:1px 4px;border-radius:3px;font-size:8px}
.ni-hl{color:#ffd700;font-weight:600}
.none{padding:20px;text-align:center;color:var(--text2);font-size:12px}

/* graph */
.graph-area{flex:1;position:relative;overflow:hidden}
#graph{width:100%;height:100%}
.gstats{position:absolute;top:10px;left:10px;padding:4px 8px;border-radius:6px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);font-size:10px;color:var(--text2);pointer-events:none;z-index:5;line-height:1.6}
.legend{position:absolute;top:10px;right:10px;z-index:5;padding:8px 10px;border-radius:8px;background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);font-size:9px;max-height:40vh;overflow-y:auto;scrollbar-width:thin}
.legend::-webkit-scrollbar{width:2px}
.li{display:flex;align-items:center;gap:4px;margin:1px 0}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.lt{color:var(--text2)}
.zoom-ctrl{position:absolute;bottom:80px;right:10px;display:flex;flex-direction:column;gap:2px;z-index:5}
.zb{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(10px);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.zb:hover{background:rgba(124,92,252,.2);border-color:var(--accent)}
.zbt{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(10px);color:var(--text2);font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
.zbt:hover{background:rgba(124,92,252,.2);border-color:var(--accent)}

/* info overlay */
.info{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);max-width:560px;width:92%;padding:12px 16px;border-radius:10px;border:1px solid var(--border2);background:var(--glass);backdrop-filter:blur(18px);box-shadow:0 6px 30px rgba(0,0,0,.5);z-index:8;transition:all .3s cubic-bezier(.4,0,.2,1);max-height:35vh;overflow-y:auto;scrollbar-width:thin}
.info.hidden{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}
.info .it{font-size:14px;font-weight:600;color:#fff;margin-bottom:2px}
.info .ic{font-size:9px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.info .ic .id{width:7px;height:7px;border-radius:50%;display:inline-block}
.info .is{font-size:12px;line-height:1.6;color:var(--text2)}
.info .is.col{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.info .ia{margin-top:8px;display:flex;gap:6px}
.info .ia button{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:rgba(124,92,252,.1);color:var(--text);font-size:10px;cursor:pointer;transition:.12s}
.info .ia button:hover{background:rgba(124,92,252,.25)}

/* detail panel */
.dp{position:fixed;top:0;right:0;width:420px;max-width:92vw;height:100vh;background:rgba(8,8,28,.96);backdrop-filter:blur(24px);border-left:1px solid var(--border2);box-shadow:-6px 0 30px rgba(0,0,0,.6);z-index:20;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
.dp.open{transform:translateX(0)}
.dph{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0}
.dpt{font-size:14px;font-weight:600;line-height:1.4;max-width:85%;word-break:break-all}
.dpx{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--text2);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s}
.dpx:hover{background:rgba(255,70,70,.12);color:#ff6b6b}
.dpb{flex:1;overflow-y:auto;padding:16px;line-height:1.8;font-size:12px;color:var(--text2);white-space:pre-wrap;word-break:break-word;scrollbar-width:thin}
.dpb::-webkit-scrollbar{width:3px}
.dpb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.05);border-radius:2px}

/* tooltip */
.tip{position:fixed;padding:6px 10px;border-radius:6px;background:rgba(8,8,28,.94);backdrop-filter:blur(12px);border:1px solid var(--border2);font-size:10px;color:var(--text);pointer-events:none;z-index:30;display:none;max-width:200px}

/* graph elements */
.ll{stroke:rgba(255,255,255,.04);stroke-width:.6;transition:stroke .2s,stroke-width .2s}
.ll.hl{stroke:rgba(124,92,252,.3);stroke-width:1.1}
.nc{cursor:pointer;transition:r .2s;stroke:rgba(255,255,255,.12);stroke-width:.4}
.nc.sel{stroke:#ffd700;stroke-width:2}
.nc.hl{opacity:1}
.nc.fd{opacity:.06}
.nl{font-size:8px;fill:rgba(220,220,250,.45);text-anchor:middle;pointer-events:none}
.nl.hl{opacity:1}
.nl.fd{opacity:.06}

/* mobile */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:15;width:270px;min-width:unset;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .st{position:fixed;top:8px;left:8px;z-index:16;width:30px;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(10px);color:var(--text);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .info{max-width:96%;bottom:8px;max-height:30vh;padding:10px 12px}
  .dp{width:100vw;max-width:100vw}
  .legend{display:none}
  .gstats{top:44px;left:8px;font-size:9px}
  .info .it{font-size:13px}
  .info .is{font-size:11px}
}
@media(min-width:769px){.st{display:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <button class="st" id="st" onclick="ts()">☰</button>
  <div class="sidebar" id="sd">
    <div class="sidebar-h"><h1>✦ 知识库图谱</h1><div class="sub">犬来八荒 · 高二文科</div></div>
    <div class="search-box"><input id="si" placeholder="搜索知识点..." oninput="onSearch(this.value)"></div>
    <div class="node-list" id="nl"></div>
  </div>
  <div class="graph-area">
    <div id="graph"></div>
    <div class="gstats" id="gs">加载中...</div>
    <div class="legend" id="lg"></div>
    <div class="zoom-ctrl">
      <button class="zb" onclick="zi()">+</button>
      <button class="zb" onclick="zo()">−</button>
      <button class="zbt" onclick="zr()">⟲</button>
      <button class="zbt" onclick="freezeSim()" id="frBtn" title="冻结/解冻">❄</button>
    </div>
    <div class="info hidden" id="info">
      <div class="it" id="it"></div>
      <div class="ic" id="ic"><span class="id"></span><span id="icText"></span></div>
      <div class="is col" id="is"></div>
      <div class="ia">
        <button onclick="sd(currentNodeId)">📖 展开全文</button>
        <button onclick="toggleSum()">📄 展开</button>
        <button onclick="hi()">✕ 关闭</button>
      </div>
    </div>
  </div>
  <div class="dp" id="dp">
    <div class="dph"><div class="dpt" id="dpt"></div><button class="dpx" onclick="cd()">✕</button></div>
    <div class="dpb" id="dpb"><div style="display:flex;align-items:center;justify-content:center;height:200px;font-size:12px;color:var(--text2)">加载中...</div></div>
  </div>
  <div class="tip" id="tip"></div>
</div>
<div class="loading" id="loading">
  <div class="bar"><div class="bar-inner" id="pbar"></div></div>
  <div class="txt">正在加载知识库...</div>
  <div class="sub">831 知识点 · 11,276 条关联</div>
</div>

<script>
// ═══════════════ STATE ═══════════════
let D=null, gn=[], gl=[], sim=null, svg, g, zoom;
let cni=null, sq='';
let froozen = false;

// ═══════════════ LOAD ═══════════════
(async function() {
  const pb = document.getElementById('pbar');
  try {
    pb.style.width = '10%';
    const r = await fetch('data/graph.json');
    pb.style.width = '40%';
    const raw = await r.json();
    pb.style.width = '70%';
    
    // 解包
    const m = raw.m;
    gn = m.n.map(a => ({id:a[0],title:a[1],cat:a[2],clr:a[3],sum:a[4],deg:a[5]}));
    gl = m.l.map(a => ({s:a[0],t:a[1],w:a[2]||1}));
    const subs = m.s.map(a => ({name:a[0],clr:a[1],cnt:a[2]}));
    D = { nodes:gn, links:gl, subjects:subs, entries:raw.e || {}, allIdx:raw.a || [] };
    
    pb.style.width = '85%';
    document.getElementById('gs').textContent = `${gn.length} 知识点 · ${gl.length} 关联`;
    
    buildLegend(subs);
    renderGraph();
    renderList();
    
    // 布局完成后冻结
    setTimeout(() => freezeSim(), 3000);
    
    pb.style.width = '100%';
    setTimeout(() => document.getElementById('loading').classList.add('hidden'), 300);
  } catch(e) {
    document.getElementById('gs').textContent = '❌ 加载失败';
    document.getElementById('loading').querySelector('.txt').textContent = '❌ 数据加载失败，请刷新重试';
    console.error(e);
  }
})();

// ═══════════════ LEGEND ═══════════════
function buildLegend(subs) {
  const el = document.getElementById('lg');
  subs.forEach(s => {
    const d = document.createElement('div'); d.className = 'li';
    d.innerHTML = `<span class="ld" style="background:${s.clr}"></span><span class="lt">${s.name} (${s.cnt})</span>`;
    el.appendChild(d);
  });
}

// ═══════════════ GRAPH ═══════════════
function renderGraph() {
  const c = document.getElementById('graph');
  const w = c.clientWidth||800, h = c.clientHeight||600;
  svg = d3.select('#graph').append('svg').attr('width',w).attr('height',h);
  zoom = d3.zoom().scaleExtent([0.08,8]).on('zoom', e=>g.attr('transform',e.transform));
  svg.call(zoom);
  g = svg.append('g');

  const link = g.append('g').selectAll('line').data(gl).join('line').attr('class','ll');
  const node = g.append('g').selectAll('g').data(gn).join('g')
    .call(d3.drag().on('start',ds).on('drag',dg).on('end',de));

  node.append('circle')
    .attr('class','nc')
    .attr('r', d => Math.max(3, Math.min(14, 2 + Math.sqrt(d.deg||1)*.8)))
    .attr('fill', d => d.clr||'#7c5cfc')
    .on('click', (ev,d) => { ev.stopPropagation(); onClickNode(d); })
    .on('dblclick', (ev,d) => { ev.stopPropagation(); sd(d.id); })
    .on('mouseenter', (ev,d) => { ts2(ev,d); })
    .on('mouseleave', () => { th(); });

  node.append('text')
    .attr('class','nl')
    .text(d => d.title.length>8 ? d.title.slice(0,8)+'…' : d.title)
    .attr('dy', d => Math.max(3, Math.min(14, 2+Math.sqrt(d.deg||1)*.8)) + 8);

  svg.on('click', () => { hi(); desAll(); });

  // 力模拟
  sim = d3.forceSimulation(gn)
    .force('link', d3.forceLink(gl).id(d=>d.id).distance(60).strength(.3))
    .force('charge', d3.forceManyBody().strength(d => -(30 + Math.sqrt(d.deg||1)*5)))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collision', d3.forceCollide().radius(d => 15+Math.sqrt(d.deg||1)))
    .alphaDecay(0.02)  // 更快收敛
    .velocityDecay(0.3)
    .on('tick', () => {
      link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
    });
  
  // 布局完成后停止
  setTimeout(() => { if(sim) sim.stop(); froozen = true; document.getElementById('frBtn').textContent='❄'; }, 5000);
}

function deg(nid) { let c=0; for(const l of gl){const s=l.s||(l.source&&l.source.id)||l.source,t=l.t||(l.target&&l.target.id)||l.target;if(s===nid||t===nid)c++;} return c; }

// ═══════════════ FREEZE ═══════════════
function freezeSim() {
  if (!sim) return;
  froozen = !froozen;
  const btn = document.getElementById('frBtn');
  if (froozen) {
    sim.stop();
    btn.textContent = '▶';
    btn.title = '解冻力模拟';
  } else {
    sim.alpha(0.3).restart();
    btn.textContent = '❄';
    btn.title = '冻结力模拟';
    setTimeout(() => { if(!froozen && sim) { sim.stop(); froozen=true; btn.textContent='❄'; } }, 3000);
  }
}

// ═══════════════ NODE CLICK ═══════════════
function onClickNode(d) {
  cni = d.id;
  document.getElementById('it').textContent = d.title;
  document.getElementById('icText').textContent = d.cat;
  document.getElementById('ic').querySelector('.id').style.background = d.clr;
  document.getElementById('is').textContent = d.sum||'（无概述）';
  document.getElementById('is').classList.add('col');
  document.getElementById('info').classList.remove('hidden');
  
  document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active'));
  const li = document.getElementById('li-'+d.id);
  if(li){li.classList.add('active'); li.scrollIntoView({block:'nearest'});}
  hlGraph(d.id);
}

function hlGraph(id) {
  const conn = new Set([id]);
  for(const l of gl) { const s=l.s||l.source.id||l.source, t=l.t||l.target.id||l.target; if(s===id) conn.add(t); if(t===id) conn.add(s); }
  svg.selectAll('.nc').attr('class', d => conn.has(d.id)?'nc hl':'nc fd');
  svg.selectAll('.nl').attr('class', d => conn.has(d.id)?'nl hl':'nl fd');
  svg.selectAll('.ll').attr('class', function(d) {
    const s=d.s||d.source.id||d.source, t=d.t||d.target.id||d.target;
    return conn.has(s)&&conn.has(t)?'ll hl':'ll';
  });
}

function clHL() { svg.selectAll('.nc').attr('class','nc'); svg.selectAll('.nl').attr('class','nl'); svg.selectAll('.ll').attr('class','ll'); }
function desAll() { document.querySelectorAll('.ni').forEach(el=>el.classList.remove('active')); }
function hi() { document.getElementById('info').classList.add('hidden'); clHL(); cni=null; }
function toggleSum() { document.getElementById('is').classList.toggle('col'); }

function sd(nid) {
  const e = D.entries && D.entries[nid];
  if(!e) {
    document.getElementById('dpt').textContent = '内容未找到';
    document.getElementById('dpb').textContent = '该知识点暂无详细内容';
    document.getElementById('dp').classList.add('open');
    return;
  }
  // entries格式：["title","content"]
  const title = Array.isArray(e) ? e[0] : e.title;
  const content = Array.isArray(e) ? (e[1]||'（无详细内容）') : (e.content||'（无详细内容）');
  document.getElementById('dpt').textContent = title;
  document.getElementById('dpb').textContent = content;
  document.getElementById('dp').classList.add('open');
  hi();
  if(window.innerWidth<769) document.getElementById('sd').classList.remove('open');
}

function cd() { document.getElementById('dp').classList.remove('open'); }

// ═══════════════ DRAG ═══════════════
function ds(ev,d){if(!ev.active&&!froozen)sim.alphaTarget(.3).restart();d.fx=d.x;d.fy=d.y}
function dg(ev,d){d.fx=ev.x;d.fy=ev.y}
function de(ev,d){if(!ev.active&&!froozen)sim.alphaTarget(0);if(!froozen){d.fx=null;d.fy=null}else{d.fx=d.x;d.fy=d.y}}

// ═══════════════ ZOOM ═══════════════
function zi(){svg.transition().duration(250).call(zoom.scaleBy,1.35)}
function zo(){svg.transition().duration(250).call(zoom.scaleBy,.7)}
function zr(){svg.transition().duration(250).call(zoom.transform,d3.zoomIdentity)}

// ═══════════════ TOOLTIP ═══════════════
function ts2(ev,d) {
  const t=document.getElementById('tip');
  t.innerHTML=`<strong>${d.title}</strong><br>📂 ${d.cat}<br>🔗 ${deg(d.id)} 关联`;
  t.style.display='block';
  const x=ev.clientX+10, y=ev.clientY-8;
  t.style.left=Math.min(x,window.innerWidth-220)+'px'; t.style.top=Math.max(0,y)+'px';
}
function th(){document.getElementById('tip').style.display='none'}

// ═══════════════ NODE LIST ═══════════════
function renderList(filter) {
  const el=document.getElementById('nl'); el.innerHTML='';
  if(!D) return;
  let nodes = D.nodes;
  if(filter) {
    const lc=filter.toLowerCase();
    nodes = nodes.filter(n => (n.title||'').toLowerCase().includes(lc)||(n.sum||'').toLowerCase().includes(lc)||(n.cat||'').toLowerCase().includes(lc));
  }
  if(!nodes.length){el.innerHTML='<div class="none">没有匹配的知识点</div>'; return;}
  
  const groups = {};
  for(const n of nodes) { if(!groups[n.cat]) groups[n.cat]=[]; groups[n.cat].push(n); }
  
  const order = ['政治制度','国际关系','国际安全','经济','法律','文化与思想','时政分析','全球治理','科技与数字治理','高考','历史','未分类'];
  const sorted = Object.keys(groups).sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return-1;if(ib>=0)return1;return groups[b].length-groups[a].length});
  
  for(const cat of sorted) {
    const items=groups[cat], clr=items[0].clr||'#7c5cfc';
    const h=document.createElement('div'); h.className='ng-title'; h.style.color=clr; h.textContent=`${cat} (${items.length})`;
    el.appendChild(h);
    for(const n of items) {
      const d=document.createElement('div'); d.className='ni'; d.id='li-'+n.id;
      let t=n.title;
      if(filter){const re=new RegExp(filter.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');t=t.replace(re,m=>`<span class="ni-hl">${m}</span>`);}
      d.innerHTML=`<div class="t">${t}</div><div class="m"><span class="b" style="background:${clr}22;color:${clr}">${n.cat}</span><span>${deg(n.id)} 关联</span></div>`;
      d.addEventListener('click',()=>focusNode(n.id));
      el.appendChild(d);
    }
  }
}

function focusNode(id) {
  const n = gn.find(x=>x.id===id);
  if(!n||!n.x) return;
  const c=document.getElementById('graph');
  svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(c.clientWidth/2,c.clientHeight/2).scale(1.5).translate(-n.x,-n.y));
  onClickNode(n);
  if(window.innerWidth<769) document.getElementById('sd').classList.remove('open');
}

// ═══════════════ SEARCH ═══════════════
function onSearch(v) {
  sq=v; renderList(v); searchGraph(v);
}

function searchGraph(q) {
  clHL();
  if(!q) return;
  const lc=q.toLowerCase();
  const match=new Set();
  for(const n of D.nodes) {
    if((n.title||'').toLowerCase().includes(lc)||(n.sum||'').toLowerCase().includes(lc)||(n.cat||'').toLowerCase().includes(lc))
      match.add(n.id);
  }
  if(!match.size) return;
  const conn=new Set(match);
  for(const l of gl) {const s=l.s||l.source.id||l.source, t=l.t||l.target.id||l.target;if(match.has(s))conn.add(t);if(match.has(t))conn.add(s);}
  svg.selectAll('.nc').attr('class', d => {const c=conn.has(d.id)?'nc hl':'nc fd';return match.has(d.id)?c+' sel':c;});
  svg.selectAll('.nl').attr('class', d => conn.has(d.id)?'nl hl':'nl fd');
  svg.selectAll('.ll').attr('class', function(d) {
    const s=d.s||d.source.id||d.source, t=d.t||d.target.id||d.target;
    return conn.has(s)&&conn.has(t)?'ll hl':'ll';
  });
}

// ═══════════════ SIDEBAR ═══════════════
function ts() { document.getElementById('sd').classList.toggle('open'); }
window.addEventListener('resize',()=>{if(window.innerWidth>768)document.getElementById('sd').classList.remove('open')});
</script>
